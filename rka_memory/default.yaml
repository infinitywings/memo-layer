# rka-memory defaults, shipped inside the package. Override in
# ~/.rka-memory/config.yaml; any key you leave out keeps the value below.

ledger:
  dir: ~/.rka-memory          # local spool: ledger.jsonl, blobs/, cursors
core:
  url: http://127.0.0.1:9712  # RKA Core REST; the durable store for the ledger
  project_id: null            # set by `rka-memory init`
  sync_on_session_end: true

gate:
  k: 2.0                      # weighted grounding needed for L1 -> L2
  min_sessions: 2             # distinct sessions among that grounding
  weak_only_min_sessions: 3   # ...when no event of weight >= 1 is among it
  skill_min_sessions: 2       # later sessions that followed a procedure for L2 -> L3
  retire_after_days: 60       # untouched L1 records retire to L4
  confirm_overrides: true     # a user confirm promotes straight to L2
  narrow_priority: [user_context, task_class, toolchain, model_id, project]
  # A user's quoted rule confirms its record only when the words the extractor
  # quotes as making it standing hold one of these phrases (case aside) and lie
  # within 200 characters of the rule in the same message.
  standing_phrases: [from now on, going forward, from here on, always, never, every time, each time, whenever,
                     house rule, remember, in future, in the future, by default, as a rule,
                     以后, 今后, 从现在起, 从现在开始, 往后, 每次, 总是, 始终, 一直, 永远, 记住, 默认, 规矩]

weights:                      # grounding weight per event kind (absent kinds never ground)
  exit_code: 1.0
  test_result: 1.0
  user_confirm: 1.0
  user_reject: 1.0
  user_edit: "1/3"
  user_undo: "1/3"
  user_repeat: "1/3"
  user_msg: "1/3"
  tool_result: "1/3"

packet:
  budget_tokens: 1200
  hints_budget_tokens: 600
  arms: [gated, none]         # rotated by calendar day; add `ungated` for the L1-everything baseline

scope:
  task_classes: [coding, debugging, refactoring, testing, writing, research, ops, data, other]
  user_context: default       # overridden by RKA_MEMORY_CONTEXT

signals:
  repeat_threshold: 0.8       # prompt similarity that counts as user_repeat
  repeat_lookback_sessions: 50
  dedup_threshold: 0.75       # candidate similarity that merges into an existing record
  test_commands: [pytest, "uv run pytest", "npm test", "pnpm test", "yarn test", "cargo test", "go test", "make test", "bun test", vitest, jest]
  payload_max_chars: 2000

miner:
  backend: claude_cli         # claude_cli | openai_compat | none
  model: haiku                # for openai_compat: the endpoint's model id
  timeout_seconds: 240
  base_url: ""                # openai_compat: e.g. https://api.deepseek.com/v1 (env RKA_MEMORY_MINER_BASE_URL)
  api_key_env: null           # openai_compat: name of the env var holding the key
  extract_rules: true         # also ask for the rules the user stated, as verbatim quotes

hooks:
  background: spawn           # spawn: mine and sync in a detached process; inline: before SessionEnd returns; off

skills:
  dir: ~/.claude/skills
  export_files: true          # write SKILL.md files; off where skills come through a plugin (dsh)
