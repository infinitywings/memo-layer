# rka-memory defaults, shipped inside the package. Override in
# ~/.rka-memory/config.yaml; any key you leave out keeps the value below.

ledger:
  dir: ~/.rka-memory          # local spool: ledger.jsonl, blobs/, cursors
core:
  url: http://127.0.0.1:9712  # RKA Core REST; the durable store for the ledger
  project_id: null            # set by `rka-memory init`
  sync_on_session_end: true

gate:
  k: 2.0                      # weighted grounding needed for L1 -> L2
  min_sessions: 2             # distinct sessions among that grounding
  weak_only_min_sessions: 3   # ...when no event of weight >= 1 is among it
  skill_min_sessions: 2       # later sessions that followed a procedure for L2 -> L3
  retire_after_days: 60       # untouched L1 records retire to L4
  validation: attested        # attested (DESIGN_V3) | threshold (DESIGN_V2's labelling, kept for comparison)
  # A user's quoted rule confirms its record only when the words the extractor
  # quotes as making it standing hold one of these phrases (case aside) and lie
  # within 200 characters of the rule in the same message.
  standing_phrases: [from now on, going forward, from here on, always, never, every time, each time, whenever,
                     house rule, remember, in future, in the future, by default, as a rule,
                     以后, 今后, 从现在起, 从现在开始, 往后, 每次, 总是, 始终, 一直, 永远, 记住, 默认, 规矩]

weights:                      # grounding weight per event kind (absent kinds never ground)
  exit_code: 1.0
  test_result: 1.0
  user_confirm: 1.0
  user_reject: 1.0
  user_amend: 1.0
  user_edit: "1/3"
  user_undo: "1/3"
  user_repeat: "1/3"
  user_msg: "1/3"
  tool_result: "1/3"

packet:
  budget_tokens: 1200
  arms: [gated, none]         # rotated by calendar day; add `ungated` for the L1-everything baseline

scope:
  fields: [project, toolchain]  # the state fields a record's scope may constrain; the others are always open
  task_classes: [coding, debugging, refactoring, testing, writing, research, ops, data, other]
  user_context: default       # overridden by RKA_MEMORY_CONTEXT

signals:
  repeat_threshold: 0.8       # prompt similarity that counts as user_repeat
  repeat_lookback_sessions: 50
  dedup_threshold: 0.75       # candidate similarity that merges into an existing record
  test_commands: [pytest, "uv run pytest", "npm test", "pnpm test", "yarn test", "cargo test", "go test", "make test", "bun test", vitest, jest]
  payload_max_chars: 2000

miner:
  backend: claude_cli         # claude_cli | codex_cli | openai_compat | none | silent (mines, proposes nothing)
  model: null                 # null: claude_cli uses haiku, codex_cli Codex's own default; openai_compat needs a model id
  timeout_seconds: 240
  events_max_chars: 200000    # events per miner prompt, in characters; a longer session is mined in several prompts, oldest first
  base_url: ""                # openai_compat: e.g. https://api.deepseek.com/v1 (env RKA_MEMORY_MINER_BASE_URL)
  api_key_env: null           # openai_compat: name of the env var holding the key
  extract_rules: true         # also ask for the rules the user stated, as verbatim quotes

notepad:                      # the `notepad` arm's curator, E2's model-curated baseline (docs/E2.md); same keys as miner
  backend: none               # none keeps no notepad; openai_compat for a live run
  consolidate_every: 5        # sessions between consolidation passes over the notes

trials:                       # randomized trials for prescriptive records (DESIGN_V2 5.3); pre-registered by the PI
  q: 0.5                      # chance a candidate is delivered in a session where it applies
  m: 3                        # sessions each arm needs before the trial ends, and is decided once
  alpha: 0.05                 # level of the one-sided Fisher test the treated arm's outcomes must pass
  # Under attested validation trials are sequential (DESIGN_V3 step 3, RKA jrn_01M7R3MVT74RMM4P8CFH8VR7QQ):
  e_threshold: 20             # promote when the e-process reaches this; 1/20 bounds null promotion at any horizon
  min_per_arm: 2              # sessions each arm needs before a promotion
  hold_below: 0.1             # on hold while P(treated does better) is at most this
  q_hold: 0.1                 # chance of delivery while on hold
  cluster_similarity: 0.5     # records on trial this alike (token Jaccard), or linked, share one coin

checks:                       # when a session's test results are weak (DESIGN_V2 5.1 rule 2, 8.1; refined by the PI)
  # Test files, by name. Changing or removing existing tests makes them weak; adding new tests does not.
  test_globs: ["test_*.py", "*_test.py", "*.test.js", "*.test.ts", "*.spec.js", "*.spec.ts"]
  # Test configuration, and any other file under a test directory: any change, even reverted, makes them weak.
  config_globs: ["conftest.py", "**/conftest.py", "pytest.ini", "tox.ini", "setup.cfg", "pyproject.toml", "noxfile.py", ".github/**", "Makefile", "package.json", "jest.config.*", "vitest.config.*", "tests/**", "test/**"]
  # A new test can change state other tests share. When a session added tests and its last test run
  # passed, the runner re-runs every test alone in a copy of the project; one that fails alone makes the
  # results weak. It runs code the agent wrote, so it runs only with both `python` and `confine` (a
  # command that runs `<grants> -- <argv>` with no more rights than the agent's tools, like the stack's
  # docker/dsh/confine.sh); while off, such a session's test results are weak.
  isolation: {python: null, confine: null, user: null, dir: null, framework: auto, workers: 4, budget_seconds: 20}
  # The user's own check of a session's work, such as their CI or an acceptance script: run at session end
  # in a copy of the project, through the isolation's confinement; `{python}` is its interpreter. Its
  # verdict is a trial's outcome (DESIGN_V2 5.3); what it printed is an observation the miner may cite.
  outcome: {command: null, budget_seconds: 60}

graph:
  anchors: true               # the miner may say which files, commands and tools a record is about; packets put those first

hooks:
  background: spawn           # spawn: mine and sync in a detached process; inline: before SessionEnd returns; off

skills:
  dir: ~/.claude/skills
  export_files: true          # write SKILL.md files; off where skills come through a plugin (dsh)
