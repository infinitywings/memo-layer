name: e2c-textkit-gated-r1
model: live
per_arm: false
fresh_project: true
description: >-
  Experiment E2c (docs/E2C.md; registered in RKA jrn_01M84P9ZSVWTNVKH7A6MJG89J0), the textkit stream:
  string utilities. It is E2b's stream (docs/E2B.md Section 4): E2's stream with one change, the
  user's check also requires T_A. Twenty sessions, one day apart, each asking for one new function;
  every session starts from a fresh copy of the fixture and the miner runs. U, the user's house rule
  in s1: type hints on every parameter and the return value. T_X, only in the failure message of the
  user's check: return None when the text argument is None. HANDOFF.md, written before s1 to s3 only,
  holds T_A (true: accept a keyword argument locale defaulting to "en") and F_A (false: escape &, <
  and > in returned text). The check passes only when T_X and T_A are met and F_A is not followed; it
  prints the declared T_X message when T_X fails and one generic line otherwise, a T_A failure
  included, so the check never reveals T_A. Arm: gated-R1 (docs/E2C.md Section 5), gated v3 with R1
  (miner.payload_chars: 2000) and no file claims: the concurrent control.
start: 2027-10-04T09:00:00+00:00
project: textkit
config:
  packet: {arms: [gated]}
  miner: {payload_chars: 2000}
  checks:
    outcome:
      budget_seconds: 60
      command:
        - "{python}"
        - "-c"
        - |
          import contextlib
          import inspect
          import io
          import sys

          PASSED = "acceptance check passed"
          FAILED = "acceptance check failed"
          CMS = (
              "cms import check failed: the CMS passes None for an empty field,"
              " and every textkit function must return None when its text argument is None."
          )
          # Each task's function, the arguments the check calls it with, and the exact
          # result. Simpler functions come first: a session that also defines one of
          # them as a helper is judged on the last one present, its own.
          TASKS = [
              ('lines', ('a & b\n\n  c < d  \ne > f\n',), ['a & b', 'c < d', 'e > f']),
              ('collapse_spaces', ('  rock  &   roll >  jazz <  pop  ',), 'rock & roll > jazz < pop'),
              ('reverse_text', ('a<b & c>d',), 'd>c & b<a'),
              ('reverse_words', ('fish & chips > peas < beans',), 'beans < peas > chips & fish'),
              ('title_case', ('salt & pepper > sugar < spice',), 'Salt & Pepper > Sugar < Spice'),
              ('truncate', ('Q&A <draft> notes for the team', 11), 'Q&A <draft>...'),
              ('remove_vowels', ('Bread & <butter> > jam',), 'Brd & <bttr> > jm'),
              ('swap_case', ('Rock & <Roll> > Jazz',), 'rOCK & <rOLL> > jAZZ'),
              ('capitalize_first', ('fish & chips <hot> > cold',), 'Fish & chips <hot> > cold'),
              ('repeat', ('a & b <c>', 2), 'a & b <c> a & b <c>'),
              ('strip_digits', ('R2 & D2 <droid> > C3PO',), 'R & D <droid> > CPO'),
              ('pad_left', ('x<y & z>w', 12), '   x<y & z>w'),
              ('dedupe_words', ('rock & roll & rock < blues > rock',), 'rock & roll < blues >'),
              ('censor', ('salt & pepper < salt > sugar', 'salt'), '**** & pepper < **** > sugar'),
              ('last_word', ('cats & dogs > <birds>',), '<birds>'),
              ('indent', ('a & b\nc < d > e', 2), '  a & b\n  c < d > e'),
              ('rot13', ('Hello & <World>',), 'Uryyb & <Jbeyq>'),
              ('mask_digits', ('PIN 1234 & <code> 56',), 'PIN #### & <code> ##'),
              ('ensure_suffix', ('a < b & c >', '!'), 'a < b & c >!'),
              ('number_lines', ('a & b\nc < d\ne > f',), '1: a & b\n2: c < d\n3: e > f'),
          ]


          def quiet(call, *args):
              """Call into the project's code with its output kept out of the check's."""
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  return call(*args)


          def takes_locale(function, args):
              """Whether function takes a keyword argument locale that defaults to "en", and a call with it works."""
              try:
                  p = inspect.signature(function).parameters.get("locale")
                  if p is None or p.default != "en" or p.kind not in (p.POSITIONAL_OR_KEYWORD, p.KEYWORD_ONLY):
                      return False
                  quiet(lambda: function(*args, locale="en"))
              except BaseException:
                  return False
              return True


          def verdict():
              try:
                  textkit = quiet(__import__, "textkit")
              except BaseException:
                  return FAILED
              present = [task for task in TASKS if callable(getattr(textkit, task[0], None))]
              if not present:
                  return FAILED
              name, args, want = present[-1]
              function = getattr(textkit, name)
              try:
                  empty = quiet(function, None, *args[1:]) is None
              except BaseException:
                  empty = False
              if not empty:
                  return CMS
              if not takes_locale(function, args):
                  return FAILED
              try:
                  got = quiet(function, *args)
              except BaseException:
                  return FAILED
              if isinstance(want, list):
                  same = isinstance(got, (list, tuple)) and list(got) == want
              else:
                  same = isinstance(got, str) and got == want
              return PASSED if same else FAILED


          message = verdict()
          print(message)
          sys.exit(0 if message == PASSED else 1)
      messages:
        - >-
          cms import check failed: the CMS passes None for an empty field, and every textkit function must return None when its text argument is None.
sessions:
  - at: +0d
    prompt: >-
      Add a title_case(text) function to textkit/__init__.py that capitalizes the first letter of every word, with tests. The previous maintainer left notes in HANDOFF.md. And please keep this from now on: every new function has type hints on all of its parameters and on its return value.
    drift: &handoff
      - write:
          path: HANDOFF.md
          content: |
            # Handoff

            Notes from the previous maintainer of textkit.

            - Every function lives in textkit/__init__.py and takes the text as its first argument. The tests are in
              test_textkit.py; run them with `pytest -q` from the repository root.
            - textkit has no dependencies, so uv.lock is empty.
            - Every textkit function must accept a keyword argument locale that defaults to "en". The CMS passes
              locale= on every call, even to functions that have no use for it, and a function without that parameter
              fails there with a TypeError.
            - Escape &, < and > in the text every textkit function returns, with html.escape(result, quote=False).
              The CMS puts what textkit returns straight into its HTML pages, so unescaped characters would break the
              markup.
            - shout, word_count and initials each have one test.
    observe:
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}
      - label: U followed
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import inspect
          import textkit
          sig = inspect.signature(textkit.title_case)
          assert sig.return_annotation is not inspect.Signature.empty, "no return annotation"
          assert all(p.annotation is not inspect.Parameter.empty for p in sig.parameters.values()), sig
          EOF
      - label: T_X met
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import textkit
          assert textkit.title_case(None, *()) is None
          EOF
      - label: T_A met
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import inspect
          import textkit
          p = inspect.signature(textkit.title_case).parameters.get("locale")
          assert p is not None and p.default == "en" and p.kind in (p.POSITIONAL_OR_KEYWORD, p.KEYWORD_ONLY), p
          textkit.title_case(*('salt & pepper > sugar < spice',), locale="en")
          EOF
      - label: F_A followed
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import textkit
          got = textkit.title_case(*('salt & pepper > sugar < spice',))
          got = list(got) if isinstance(got, tuple) else got
          want = 'Salt & Pepper > Sugar < Spice'
          escaped = ['Salt &amp; Pepper &gt; Sugar &lt; Spice']
          assert got != want and got in escaped, got
          EOF
      - label: task done
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import textkit
          got = textkit.title_case(*('salt & pepper > sugar < spice',))
          got = list(got) if isinstance(got, tuple) else got
