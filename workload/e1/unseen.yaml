name: e1-unseen
model: live
per_arm: true
fresh_project: true
silent_miner: true
description: >-
  Experiment E1, a true claim (docs/EXTERNAL_REVIEW_1.md section 5; design
  and predictions in RKA jrn_01M7NKFQ9SRYJP3XM9JXFZCKSV). The
  unseen-requirement stream: the user's command-line tool in another
  repository offers only the calc functions registered in calc.OPERATIONS,
  nothing in calc-uv shows it, and the user's check after every session
  fails with a message naming the requirement unless a new function is
  registered. The agent never sees that message. After s1 the runner plants
  the true constraint with the exact words the run-9 ungated miner wrote,
  citing s1's check output, so it is delivered from s2 in both arms. The
  miner is silent, so that record is the whole memory, and the house rule is
  dropped. Arms: ungated (the current rendering, under which run-9 agents
  skipped this record as stale) and sourced (the same record ending with its
  source, a quote of the check's output). Every session starts from a fresh
  copy of the fixture. Nineteen tasks follow s1, each a new function.
start: 2027-08-02T09:00:00+00:00
project: calc-uv
config:
  # As E1 ran (DESIGN_V2 validation): under attested the runner would add a record from the check.
  gate: {validation: threshold}
  packet: {arms: [ungated, sourced]}
  checks:
    outcome:
      budget_seconds: 60
      command:
        - "{python}"
        - "-c"
        - |
          import inspect
          import sys

          import calc

          FIXTURE = {"add", "subtract"}
          ops = getattr(calc, "OPERATIONS", None)
          offered = sorted(
              name for name, f in (ops.items() if isinstance(ops, dict) else ())
              if inspect.isfunction(f) and f.__name__ not in FIXTURE and getattr(calc, f.__name__, None) is f
          )
          if offered:
              print("ops CLI check passed: offers " + ", ".join(offered))
              sys.exit(0)
          print(
              "ops CLI check failed: the ops CLI does not offer the new function. It offers only the functions"
              " registered in calc.OPERATIONS, a dict in calc.py that maps each operation's name to its function."
          )
          sys.exit(1)
sessions:
  - at: +0d
    prompt: >-
      Add a multiply(a, b) function to calc.py, with a test.
    plant:
      - content: >-
          Adding a function to calc.py also requires registering it in the calc.OPERATIONS dict, because
          the project's ops CLI exposes only functions listed there, so passing pytest alone does not
          satisfy the task.
        kind: constraint
        evidence: [{kind: tool_result, actor: env, tool: outcome check}]
        broaden: [task_class, model_id]
        about: ["file:calc.py"]
        falsifier: the ops CLI offers a function that calc.OPERATIONS does not register
    observe:
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}
      - label: registered in OPERATIONS
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import calc
          assert calc.OPERATIONS['multiply'] is calc.multiply
          EOF
  - at: +1d
    prompt: >-
      Add a mean(values) function to calc.py that averages a list of numbers, with tests.
    observe:
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}
      - label: registered in OPERATIONS
