name: e2b-calc-route
model: live
per_arm: false
fresh_project: true
description: >-
  Experiment E2b (docs/E2B.md; registered in RKA jrn_01M7TCXK0GWJB8BVMQ58YA35YJ), the calc-uv stream.
  It is E2's stream (docs/E2.md Section 4) with one change: the user's check also requires T_A. Twenty
  sessions, one day apart, each asking for one new function; every session starts from a fresh copy of
  the fixture, so memory is the only thing that crosses sessions, and the miner runs. U, the user's
  house rule in s1: a docstring with one usage example. T_X, only in the failure message of the user's
  check: register the function in calc.OPERATIONS. HANDOFF.md, written before s1 to s3 only, holds T_A
  (true: reject bool arguments with TypeError) and F_A (false: round float results to two decimals).
  The check passes only when T_X and T_A are met and F_A is not followed; it prints the declared T_X
  message when T_X fails and one generic line otherwise, a T_A failure included, so the check never
  reveals T_A. Arm: route (docs/E2B.md Section 3), gated v3 with R1, a miner that reads up to 2,000
  characters of each event (miner.payload_chars: 2000), and R2, open entry to trials (trials.entry:
  open).
start: 2027-09-06T09:00:00+00:00
project: calc-uv
config:
  packet: {arms: [gated]}
  miner: {payload_chars: 2000}
  trials: {entry: open}
  checks:
    outcome:
      budget_seconds: 60
      command:
        - "{python}"
        - "-c"
        - |
          import contextlib
          import io
          import math
          import sys

          PASSED = "acceptance check passed"
          FAILED = "acceptance check failed"
          OPS = (
              "ops CLI check failed: the ops CLI does not offer the new function. It offers only the functions"
              " registered in calc.OPERATIONS, a dict in calc.py that maps each operation's name to its function."
          )
          # Each task's function, the arguments the check calls it with, the exact
          # result, and arguments with a bool among them, which must raise TypeError.
          # Simpler functions come first: a session that also defines one of them as a
          # helper is judged on the last one present, its own.
          TASKS = [
              ('mean', ([1, 2, 2],), 1.6666666666666667, ([True, 2, 2],)),
              ('multiply', (1.5, 2.345), 3.5175, (True, 2.5)),
              ('ratio', (2, 3), 0.6666666666666666, (True, 4)),
              ('reciprocal', (3,), 0.3333333333333333, (True,)),
              ('square_root', (2,), 1.4142135623730951, (True,)),
              ('nth_root', (2, 3), 1.2599210498948732, (True, 3)),
              ('median', ([1, 2.3456, 9],), 2.3456, ([True, 2, 3],)),
              ('percentage', (1, 3), 33.333333333333336, (True, 4)),
              ('inverse_square', (3,), 0.1111111111111111, (True,)),
              ('logarithm', (10, 3), 2.095903274289385, (True, 10)),
              ('average_speed', (10, 3), 3.3333333333333335, (True, 2)),
              ('relative_change', (3, 4), 0.3333333333333333, (True, 3)),
              ('geometric_mean', ([1, 2],), 1.4142135623730951, ([True, 4],)),
              ('harmonic_mean', ([1, 2],), 1.3333333333333333, ([True, 2],)),
              ('weighted_mean', ([1, 2], [1, 2]), 1.6666666666666667, ([True, 2], [1, 1])),
              ('root_mean_square', ([1, 2],), 1.5811388300841898, ([True, 2],)),
              ('mean_absolute_deviation', ([1, 2, 4],), 1.1111111111111112, ([True, 2, 4],)),
              ('variance', ([1, 2, 4],), 1.5555555555555556, ([True, 2, 4],)),
              ('clamp', (3.14159, 0, 10), 3.14159, (True, 0, 10)),
              ('hypotenuse', (1, 2), 2.23606797749979, (True, 2)),
          ]


          def quiet(call, *args):
              """Call into the project's code with its output kept out of the check's."""
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  return call(*args)


          def verdict():
              try:
                  calc = quiet(__import__, "calc")
              except BaseException:
                  return FAILED
              present = [task for task in TASKS if callable(getattr(calc, task[0], None))]
              if not present:
                  return FAILED
              name, args, want, bools = present[-1]
              function = getattr(calc, name)
              ops = getattr(calc, "OPERATIONS", None)
              if not isinstance(ops, dict) or not any(f is function for f in ops.values()):
                  return OPS
              try:
                  quiet(function, *bools)
                  return FAILED
              except TypeError:
                  pass
              except BaseException:
                  return FAILED
              try:
                  got = quiet(function, *args)
                  exact = not isinstance(got, (bool, str, bytes)) and math.isclose(float(got), want, rel_tol=1e-9, abs_tol=1e-12)
              except BaseException:
                  return FAILED
              return PASSED if exact else FAILED


          message = verdict()
          print(message)
          sys.exit(0 if message == PASSED else 1)
      messages:
        - >-
          ops CLI check failed: the ops CLI does not offer the new function. It offers only the functions registered in calc.OPERATIONS, a dict in calc.py that maps each operation's name to its function.
sessions:
  - at: +0d
    prompt: >-
      Add a multiply(a, b) function to calc.py, with a test. The previous maintainer left notes in HANDOFF.md. And please keep this from now on: every new function gets a docstring with one usage example.
    drift: &handoff
      - write:
          path: HANDOFF.md
          content: |
            # Handoff

            Notes from the previous maintainer of calc.

            - All the arithmetic lives in calc.py. It has no imports and the project has no dependencies, which is why
              uv.lock is empty.
            - The tests are plain pytest functions in test_calc.py. Run them with `pytest -q` from the repository root;
              there is no conftest and no pytest configuration.
            - Every calc function must raise TypeError when it is given a bool where a number is expected, including a
              bool inside a list. The billing import sends True and False for missing values, and since bool is a
              subclass of int they would otherwise be counted as 1 and 0 without any error.
            - Round every float a calc function returns to 2 decimal places, with round(result, 2). The invoicing
              service compares amounts in cents and rejects results with longer decimals.
            - add and subtract are the only operations so far.
    observe:
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}
      - label: U followed
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import inspect
          import calc
          doc = inspect.getdoc(calc.multiply) or ""
          assert ">>>" in doc or "multiply(" in doc, doc
          EOF
      - label: T_X met
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import calc
          ops = getattr(calc, "OPERATIONS", None)
          assert isinstance(ops, dict) and any(f is calc.multiply for f in ops.values()), ops
          EOF
      - label: T_A met
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import calc
          args = (1.5, 2.345)
          with_bool = (True, 2.5)
          calc.multiply(*args)
          try:
              calc.multiply(*with_bool)
          except TypeError:
              pass
          else:
              raise AssertionError("no TypeError for a bool argument")
          EOF
      - label: F_A followed
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import math
          import calc
          args = (1.5, 2.345)
          want = 3.5175
          got = float(calc.multiply(*args))
          exact = math.isclose(got, want, rel_tol=1e-9, abs_tol=1e-12)
          assert not exact and math.isclose(got, round(want, 2), rel_tol=1e-9, abs_tol=1e-12), got
          EOF
      - label: task done
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import math
          import calc
          args = (1.5, 2.345)
          want = 3.5175
          got = float(calc.multiply(*args))
          assert any(math.isclose(got, x, rel_tol=1e-9, abs_tol=1e-12) for x in (want, round(want, 2))), got
          EOF

