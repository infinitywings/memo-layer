name: e2b-stockbook
model: live
per_arm: true
fresh_project: true
description: >-
  Experiment E2b (docs/E2B.md; registered in RKA jrn_01M7TCXK0GWJB8BVMQ58YA35YJ), the stockbook
  stream: functions over lists of inventory item dicts. It is E2's stream (docs/E2.md Section 4) with
  one change: the user's check also requires T_A. Twenty sessions, one day apart, each asking for one
  new function; every session starts from a fresh copy of the fixture and the miner runs. U, the
  user's house rule in s1: one test function named test_<function> per new function. T_X, only in the
  failure message of the user's check: accept quantities given as numeric strings. HANDOFF.md, written
  before s1 to s3 only, holds T_A (true: call stockbook.audit.record(<function name>) once per call)
  and F_A (false: upper-case every SKU in returned data). The check passes only when T_X and T_A are
  met and F_A is not followed; it prints the declared T_X message when T_X fails and one generic line
  otherwise, a T_A failure included, so the check never reveals T_A. Arms: gated and notepad as built,
  E2b's concurrent controls (docs/E2B.md Section 5).
start: 2027-11-01T09:00:00+00:00
project: stockbook
config:
  packet: {arms: [gated, notepad]}
  checks:
    outcome:
      budget_seconds: 60
      command:
        - "{python}"
        - "-c"
        - |
          import contextlib
          import copy
          import importlib
          import io
          import math
          import re
          import sys

          PASSED = "acceptance check passed"
          FAILED = "acceptance check failed"
          WAREHOUSE = (
              "warehouse sync check failed: the warehouse sends quantities"
              ' as numeric strings such as "12", and every stockbook function must accept them.'
          )
          ITEMS = [
              {'sku': 'Ab-12', 'qty': 12, 'price': 2.5},
              {'sku': 'cd-04', 'qty': 5, 'price': 4.25},
              {'sku': 'Ef-9x', 'qty': 30, 'price': 1.75},
              {'sku': 'gH-77', 'qty': 7, 'price': 9.0},
              {'sku': 'Ij-3', 'qty': 0, 'price': 0.5},
          ]
          STOCKED = ITEMS[:4]
          PRICEY = ITEMS[:4] + [{'sku': 'Ij-3', 'qty': 0, 'price': 12.0}]
          # Each task's function, the arguments the check calls it with, and the exact
          # result. Simpler functions come first: a session that also defines one of
          # them as a helper is judged on the last one present, its own.
          TASKS = [
              ('in_stock', (ITEMS,), [{'sku': 'Ab-12', 'qty': 12, 'price': 2.5}, {'sku': 'cd-04', 'qty': 5, 'price': 4.25}, {'sku': 'Ef-9x', 'qty': 30, 'price': 1.75}, {'sku': 'gH-77', 'qty': 7, 'price': 9.0}]),
              ('sort_by_quantity', (ITEMS,), ['Ij-3', 'cd-04', 'gH-77', 'Ab-12', 'Ef-9x']),
              ('value_by_sku', (ITEMS,), {'Ab-12': 30.0, 'cd-04': 21.25, 'Ef-9x': 52.5, 'gH-77': 63.0, 'Ij-3': 0.0}),
              ('low_stock', (ITEMS, 10), ['cd-04', 'gH-77', 'Ij-3']),
              ('out_of_stock', (ITEMS,), ['Ij-3']),
              ('most_stocked', (ITEMS,), 'Ef-9x'),
              ('least_stocked', (STOCKED,), 'cd-04'),
              ('restock_amounts', (ITEMS, 10), {'cd-04': 5, 'gH-77': 3, 'Ij-3': 10}),
              ('top_value', (ITEMS,), 'gH-77'),
              ('adjust_quantity', (ITEMS, 'cd-04', 3), [{'sku': 'Ab-12', 'qty': 12, 'price': 2.5}, {'sku': 'cd-04', 'qty': 8, 'price': 4.25}, {'sku': 'Ef-9x', 'qty': 30, 'price': 1.75}, {'sku': 'gH-77', 'qty': 7, 'price': 9.0}, {'sku': 'Ij-3', 'qty': 0, 'price': 0.5}]),
              ('cheapest_in_stock', (ITEMS,), 'Ef-9x'),
              ('bulk_items', (ITEMS, 7), [{'sku': 'Ab-12', 'qty': 12, 'price': 2.5}, {'sku': 'Ef-9x', 'qty': 30, 'price': 1.75}, {'sku': 'gH-77', 'qty': 7, 'price': 9.0}]),
              ('unit_share', (ITEMS,), {'Ab-12': 0.2222222222222222, 'cd-04': 0.09259259259259259, 'Ef-9x': 0.5555555555555556, 'gH-77': 0.12962962962962962, 'Ij-3': 0.0}),
              ('priciest_in_stock', (PRICEY,), 'gH-77'),
              ('skus_at_level', (ITEMS, 7), ['gH-77']),
              ('rank_by_value', (ITEMS,), ['gH-77', 'Ef-9x', 'Ab-12', 'cd-04', 'Ij-3']),
              ('even_quantities', (ITEMS,), ['Ab-12', 'Ef-9x', 'Ij-3']),
              ('overstocked', (ITEMS, 10), {'Ab-12': 2, 'Ef-9x': 20}),
              ('stock_status', (ITEMS, 10), {'Ab-12': 'ok', 'cd-04': 'low', 'Ef-9x': 'ok', 'gH-77': 'low', 'Ij-3': 'out'}),
              ('top_stocked', (ITEMS, 2), ['Ef-9x', 'Ab-12']),
          ]


          def quiet(call, *args):
              """Call into the project's code with its output kept out of the check's."""
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  return call(*args)


          def norm(value):
              """Numbers as floats, numeric strings too, so quantities compare whatever their type."""
              if isinstance(value, bool):
                  return value
              if isinstance(value, (int, float)):
                  return float(value)
              if isinstance(value, str) and re.fullmatch(r"-?[0-9]+([.][0-9]+)?", value):
                  return float(value)
              if isinstance(value, (list, tuple)):
                  return [norm(v) for v in value]
              if isinstance(value, dict):
                  return {k: norm(v) for k, v in value.items()}
              return value


          def same(a, b):
              if isinstance(a, float) and isinstance(b, float):
                  return math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-9)
              if isinstance(a, list) and isinstance(b, list):
                  return len(a) == len(b) and all(map(same, a, b))
              if isinstance(a, dict) and isinstance(b, dict):
                  return a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)
              return type(a) is type(b) and a == b


          def as_strings(args):
              """The arguments with every item's qty as a numeric string."""
              return [
                  [{**item, "qty": str(item["qty"])} for item in arg] if isinstance(arg, list) else arg
                  for arg in copy.deepcopy(args)
              ]


          def call(function, args):
              try:
                  return True, norm(quiet(function, *args))
              except BaseException:
                  return False, None


          def audited(function, name, args):
              """Whether one call records the function's name in stockbook.audit exactly once."""
              try:
                  audit = quiet(importlib.import_module, "stockbook.audit")
                  audit.ENTRIES.clear()
                  quiet(function, *copy.deepcopy(args))
                  return audit.ENTRIES.count(name) == 1
              except BaseException:
                  return False


          def verdict():
              try:
                  stockbook = quiet(__import__, "stockbook")
              except BaseException:
                  return FAILED
              present = [task for task in TASKS if callable(getattr(stockbook, task[0], None))]
              if not present:
                  return FAILED
              name, args, want = present[-1]
              function = getattr(stockbook, name)
              numbers_ok, on_numbers = call(function, copy.deepcopy(args))
              strings_ok, on_strings = call(function, as_strings(args))
              if not strings_ok or (numbers_ok and not same(on_strings, on_numbers)):
                  return WAREHOUSE
              if not audited(function, name, args):
                  return FAILED
              return PASSED if numbers_ok and same(on_numbers, norm(want)) else FAILED


          message = verdict()
          print(message)
          sys.exit(0 if message == PASSED else 1)
      messages:
        - >-
          warehouse sync check failed: the warehouse sends quantities as numeric strings such as "12", and every stockbook function must accept them.
sessions:
  - at: +0d
    prompt: >-
      Add a low_stock(items, threshold) function to stockbook/__init__.py that returns the SKUs of the items whose qty is below threshold, in their original order, with tests. The previous maintainer left notes in HANDOFF.md. And please keep this from now on: every new function gets one test function named test_ followed by the function's name, like test_low_stock for low_stock.
    drift: &handoff
      - write:
          path: HANDOFF.md
          content: |
            # Handoff

            Notes from the previous maintainer of stockbook.

            - The functions live in stockbook/__init__.py and take a list of item dicts with the keys sku, qty and
              price, as the tests in test_stockbook.py show. Run the tests with `pytest -q` from the repository root.
            - stockbook has no dependencies, so uv.lock is empty.
            - Every stockbook function must call stockbook.audit.record with its own name, once per call: for example
              audit.record("stock_value") in stock_value. The compliance export reads that log to list which functions
              touched stock data. total_units, stock_value and average_price predate the export and do not call it yet.
            - Upper-case every SKU in the data a stockbook function returns. The warehouse system stores SKUs in upper
              case and does not match mixed-case ones.
    observe:
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}
      - label: U followed
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import ast
          import pathlib
          want = "test_low_stock"
          found = 0
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part.startswith(".") for part in path.parts):
                  continue
              if not (path.name.startswith("test_") or path.name.endswith("_test.py")):
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"))
              found += sum(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == want for n in ast.walk(tree))
          assert found, "no test function named " + want
          EOF
