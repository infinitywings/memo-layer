name: broadened-counter
description: >-
  v2 does not narrow scopes. A fact broadened over toolchain is validated in
  uv sessions. The project then drifts to pip, where the suite fails and the
  miner links the failure as counter-evidence. The failure is inside the
  record's scope, so the record drops to L1 and is delivered in neither uv
  nor pip state afterwards. Saying that a record no longer holds in some
  state, while it still holds in others, is an update-mode amendment with a
  state condition (DESIGN_V2 6.1, layer 3), authored by the user, not a
  narrowing the engine chooses.
start: 2027-01-04T12:00:00+00:00
project: calc-uv
config:
  # Tests DESIGN_V2's threshold validation, kept as a comparison mode (DESIGN_V3 4).
  gate: {validation: threshold}
sessions:
  - at: +0d
    prompt: Add a multiply function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def multiply(a, b):\n    return a * b\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      candidates:
        - &suite
          content: "calc.py's test suite passes with pytest -q"
          kind: fact
          broaden: [toolchain]
          evidence: [{kind: test_result, passed: true}]
    expect:
      - {record: "calc.py's test suite passes with pytest -q", rung: L1}

  - at: +1d
    prompt: Add a divide function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def divide(a, b):\n    return a / b\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      candidates: [*suite]
    expect:
      - {record: "calc.py's test suite passes with pytest -q", rung: L2}

  - at: +2d
    drift:
      - remove: uv.lock
      - write: {path: requirements.txt, content: "pytest\n"}
      - write: {path: test_pip.py, content: "import calc\n\n\ndef test_power():\n    assert calc.power(2, 3) == 8\n"}
    prompt: Add a negate function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def negate(a):\n    return -a\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      counter_links:
        - record: "calc.py's test suite passes with pytest -q"
          event: {kind: test_result, passed: false}
          reason: the suite fails in the pip project
    expect:
      - {record: "calc.py's test suite passes with pytest -q", delivered: true}
      - {record: "calc.py's test suite passes with pytest -q", rung: L1}

  - at: +3d
    drift:
      - remove: requirements.txt
      - remove: test_pip.py
      - write: {path: uv.lock, content: ""}
    prompt: Add a modulo function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def modulo(a, b):\n    return a % b\n\n\ndef subtract"}
      - bash: pytest -q
    expect:
      - {record: "calc.py's test suite passes with pytest -q", delivered: false}
      - {record: "calc.py's test suite passes with pytest -q", in_prompt: false}
      - {record: "calc.py's test suite passes with pytest -q", rung: L1}

  - at: +4d
    drift:
      - remove: uv.lock
      - write: {path: requirements.txt, content: "pytest\n"}
    prompt: Add a maximum function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def maximum(a, b):\n    return max(a, b)\n\n\ndef subtract"}
      - bash: pytest -q
    expect:
      - {record: "calc.py's test suite passes with pytest -q", delivered: false}
      - {record: "calc.py's test suite passes with pytest -q", rung: L1}
