name: citation
description: >-
  A fact that cites a file and the words it rests on is checked by the
  runner (DESIGN_V2 8.2): when it is proposed, and again before every
  session's packet is built. Each check is logged before any label reads
  it, in the session it ran in; each session also logs its modification
  check, so a session adds one check event besides the citation's. The
  model chose the words, so a passing check shows only that they are in the
  file: it is no evidence that the fact holds, and the fact validates on
  passing tests in two sessions as any fact does. When the user deletes the
  cited file, the next check fails, and a failed runner-owned check
  withdraws the fact (7.2): it goes to L4 and is not delivered. This
  replaces v1's note that a file no longer exists, which read the live
  filesystem at render time.
start: 2027-01-04T12:00:00+00:00
project: calc-uv
sessions:
  - at: +0d
    drift:
      - write: {path: helpers.py, content: "def clamp(value, low, high):\n    return max(low, min(value, high))\n"}
    prompt: Add a multiply function to calc.py, next to clamp in helpers.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def multiply(a, b):\n    return a * b\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      candidates:
        - &clamp
          content: helpers.clamp keeps a value between two bounds
          kind: fact
          evidence: [{kind: test_result, passed: true}]
          cites: [{path: helpers.py, quote: "return max(low, min(value, high))"}]
    expect:
      - {record: helpers.clamp keeps a value between two bounds, rung: L1}
      - {events: {kind: check, count: 2}}

  - at: +1d
    prompt: Add a divide function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def divide(a, b):\n    return a / b\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      candidates: [*clamp]
    expect:
      - {record: helpers.clamp keeps a value between two bounds, delivered: false}
      - {record: helpers.clamp keeps a value between two bounds, rung: L2}
      - {events: {kind: check, count: 4}}

  - at: +2d
    prompt: Add a power function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def power(a, b):\n    return a ** b\n\n\ndef subtract"}
      - bash: pytest -q
    expect:
      - {record: helpers.clamp keeps a value between two bounds, delivered: true}

  - at: +3d
    drift:
      - remove: helpers.py
    prompt: Add a negate function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def negate(a):\n    return -a\n\n\ndef subtract"}
      - bash: pytest -q
    expect:
      - {record: helpers.clamp keeps a value between two bounds, delivered: false}
      - {record: helpers.clamp keeps a value between two bounds, rung: L4}
