name: defeat
description: >-
  The user withdraws one evidence edge by typing `rkm defeat` with the id of
  the link: the second session's passing test said nothing about the fact.
  Without that edge the fact's support no longer meets the threshold, so it
  falls to L1 and leaves the packet; nothing else changes (DESIGN_V2 6.1,
  defeats_edge).
start: 2027-01-04T12:00:00+00:00
project: calc-uv
sessions:
  - at: +0d
    prompt: Add a multiply function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def multiply(a, b):\n    return a * b\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      candidates:
        - &order
          content: calc.py keeps its functions in alphabetical order
          kind: fact
          evidence: [{kind: test_result, passed: true}]
    expect:
      - {record: calc.py keeps its functions in alphabetical order, rung: L1}

  - at: +1d
    prompt: Add a divide function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def divide(a, b):\n    return a / b\n\n\ndef subtract"}
      - bash: pytest -q
    miner:
      candidates: [*order]
    expect:
      - {record: calc.py keeps its functions in alphabetical order, rung: L2}

  - at: +2d
    prompt: Add a power function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def power(a, b):\n    return a ** b\n\n\ndef subtract"}
      - bash: pytest -q
    user:
      - rkm: {op: defeat, record: calc.py keeps its functions in alphabetical order, from_session: s2}
    expect:
      - {record: calc.py keeps its functions in alphabetical order, delivered: true}
      - {record: calc.py keeps its functions in alphabetical order, rung: L1}

  - at: +3d
    prompt: Add a negate function to calc.py
    agent:
      - edit: {path: calc.py, old: "def subtract", new: "def negate(a):\n    return -a\n\n\ndef subtract"}
      - bash: pytest -q
    expect:
      - {record: calc.py keeps its functions in alphabetical order, delivered: false}
