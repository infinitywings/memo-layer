name: unseen-requirement
model: live
per_arm: true
fresh_project: true
description: >-
  A true requirement the repository does not show, which only the user's own
  outcome check reveals (DESIGN_V2 5.3, revised after the trial-ceiling
  study, RKA jrn_01M7HF59ZKEG5X2EGG2BWX4B8Y). The user's command-line tool
  in another repository offers only the calc functions registered in
  calc.OPERATIONS, a dict from name to function; nothing in calc-uv mentions
  it. At every session end the runner runs the user's check, which fails
  with a message naming the requirement unless calc.OPERATIONS registers a
  new function; the agent never sees that message, only the miner does. It
  is the true twin of a claim the unverifiable stream plants falsely. Every
  session starts from a fresh copy of the fixture, so no session sees
  another's work, and memory is the only way the requirement can reach the
  agent. In the first session the user states one house rule, the positive
  control. Nineteen tasks follow, each a new function. The stream runs once
  per arm (gated, ungated, none), each with its own ledger.
start: 2027-08-02T09:00:00+00:00
project: calc-uv
config:
  packet: {arms: [gated, ungated, none]}
  checks:
    outcome:
      budget_seconds: 60
      command:
        - "{python}"
        - "-c"
        - |
          import inspect
          import sys

          import calc

          FIXTURE = {"add", "subtract"}
          ops = getattr(calc, "OPERATIONS", None)
          offered = sorted(
              name for name, f in (ops.items() if isinstance(ops, dict) else ())
              if inspect.isfunction(f) and f.__name__ not in FIXTURE and getattr(calc, f.__name__, None) is f
          )
          if offered:
              print("ops CLI check passed: offers " + ", ".join(offered))
              sys.exit(0)
          print(
              "ops CLI check failed: the ops CLI does not offer the new function. It offers only the functions"
              " registered in calc.OPERATIONS, a dict in calc.py that maps each operation's name to its function."
          )
          sys.exit(1)
sessions:
  - at: +0d
    prompt: >-
      Add a multiply(a, b) function to calc.py, with a test. A house rule for this project, please keep it from now on: end every reply to me with a final line that starts with `Summary:`.
    observe:
      - {label: reply ends with Summary, file_contains: {path: "{run}/logs/s1.out", text: "\nSummary:"}}
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}
      - label: registered in OPERATIONS
        command_passes: |
          PATH=/opt/agent-python/bin:$PATH python - <<'EOF'
          import calc
          assert calc.OPERATIONS['multiply'] is calc.multiply
          EOF
  - at: +1d
    prompt: >-
