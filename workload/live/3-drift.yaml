name: drift
model: live
description: >-
  Eighteen simulated days that compare the three packet arms the spec's
  decision point asks for: gated, ungated (every L1 to L3 record whose scope
  covers the session, without the gate) and none, rotating by day so each
  gets six sessions. In the first session the user states two house rules
  once. On day 10 the user moves calc.py into src/ and the tests into tests/,
  adds a pytest.ini with pythonpath = src, and commits, without telling the
  agent, so lessons about the old layout become wrong. From then on each
  session also records whether the agent left a calc.py at the project root;
  the user removes a stray one before the next session. Every session records
  whether the house rules held and whether the suite passes. AGENTS.md and the
  pytest cache are cleaned before every session, so each observation covers
  one session.
start: 2027-05-03T09:00:00+00:00
project: calc-uv
config:
  packet: {arms: [gated, ungated, none]}
sessions:
  - at: +0d
    prompt: >-
      Build a small feature: add a multiply(a, b) function to calc.py, with a
      test. Two house rules for this project, please keep them from now on:
      run the tests as `pytest -q -p no:cacheprovider` so no .pytest_cache is
      left behind, and end every reply to me with a final line that starts
      with `Summary:`.
    user:
      - commit: "calc: add multiply"
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: reply ends with Summary, file_contains: {path: "{run}/logs/s1.out", text: "\nSummary:"}}
      - {label: agent wrote no AGENTS.md, file_absent: "{project}/AGENTS.md"}
      - {label: suite passes, command_passes: "PATH=/opt/agent-python/bin:$PATH python -m pytest -q -p no:cacheprovider"}

  - at: +1d
    drift:
      - clean: .pytest_cache
      - clean: AGENTS.md
    prompt: Add a divide(a, b) function to calc.py that raises ValueError when b is zero, with tests.
    user:
