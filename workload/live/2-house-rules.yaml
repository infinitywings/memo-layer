name: house-rules
model: live
description: >-
  Twelve simulated days of small coding tasks with a real model. In the first
  session the user states two house rules that leave nothing in the project
  for a later session to see: run the tests as `pytest -q -p no:cacheprovider`
  so no .pytest_cache is left behind, and end every reply with a line that
  starts with `Summary:`. The user repeats them once, in the third session, as
  people do when an agent forgets, and never again, and commits after every
  session. Packets and skills alternate by simulated day between the gated arm
  and no memory. Each session records whether each rule held; the cache is
  cleared before every session, so each observation covers one session. The
  cache rule can be grounded by a passing test run; the reply rule only by the
  user's words. The first message marks both as standing ("please keep them
  from now on"), and a standing statement of a rule's exact words confirms it.
  After the sessions where the user
  states the rules, and at the end, it also records whether each rule is in
  the ledger at all, whatever its rung: the miner's recall.
  The agent may write the rules into an AGENTS.md, which dsh loads into every
  session whatever the arm, so the file is cleaned before each session and each
  session records whether the agent wrote one.
start: 2027-04-05T09:00:00+00:00
project: calc-uv
config:
  packet: {arms: [gated, none]}
sessions:
  - at: +0d
    prompt: >-
      Build a small feature: add a multiply(a, b) function to calc.py, with a
      test. Two house rules for this project, please keep them from now on:
      run the tests as `pytest -q -p no:cacheprovider` so no .pytest_cache is
      left behind, and end every reply to me with a final line that starts
      with `Summary:`.
    user:
      - commit: "calc: add multiply"
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: reply ends with Summary, file_contains: {path: "{run}/logs/s1.out", text: "\nSummary:"}}
      - {label: agent wrote no AGENTS.md, file_absent: "{project}/AGENTS.md"}
      - {label: cache rule recorded, record_contains: "no:cacheprovider"}
      - {label: Summary rule recorded, record_contains: "Summary:"}

  - at: +1d
    drift:
      - clean: .pytest_cache
      - clean: AGENTS.md
    prompt: Add a divide(a, b) function to calc.py that raises ValueError when b is zero, with tests.
    user:
      - commit: "calc: add divide"
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: reply ends with Summary, file_contains: {path: "{run}/logs/s2.out", text: "\nSummary:"}}
      - {label: agent wrote no AGENTS.md, file_absent: "{project}/AGENTS.md"}

  - at: +2d
    drift:
      - clean: .pytest_cache
      - clean: AGENTS.md
    prompt: >-
      Build a small feature: add a power(base, exponent) function to calc.py,
      with a test. And please remember the house rules: run pytest as
      `pytest -q -p no:cacheprovider`, and end your reply with a `Summary:`
      line.
    user:
      - commit: "calc: add power"
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: reply ends with Summary, file_contains: {path: "{run}/logs/s3.out", text: "\nSummary:"}}
      - {label: agent wrote no AGENTS.md, file_absent: "{project}/AGENTS.md"}
      - {label: cache rule recorded, record_contains: "no:cacheprovider"}
      - {label: Summary rule recorded, record_contains: "Summary:"}

