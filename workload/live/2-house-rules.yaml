name: house-rules
model: live
description: >-
  Twelve simulated days of small coding tasks with a real model. In the first
  session the user states two house rules that the code never shows: run the
  tests as `pytest -q -p no:cacheprovider` so no .pytest_cache is left behind,
  and log every new function in CHANGELOG.md as `- add <name>()`. The user
  repeats them once, in the third session, as people do when an agent forgets,
  and never again. Packets alternate by simulated day between the gated arm
  and no packet. Each session records whether each rule held; the cache is
  cleared before every session, so each observation covers one session. The
  cache rule can be grounded by a passing test run; the changelog rule only by
  the user's words, which weigh 1/3 each.
start: 2027-04-05T09:00:00+00:00
project: calc-uv
config:
  packet: {arms: [gated, none]}
sessions:
  - at: +0d
    drift:
      - write: {path: CHANGELOG.md, content: "# Changelog\n\n## Unreleased\n"}
    prompt: >-
      Build a small feature: add a multiply(a, b) function to calc.py, with a
      test. Two house rules for this project, please keep them from now on:
      run the tests as `pytest -q -p no:cacheprovider` so no .pytest_cache is
      left behind, and for every function you add, add a line `- add <name>()`
      under `## Unreleased` in CHANGELOG.md.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add multiply("}}

  - at: +1d
    drift:
      - clean: .pytest_cache
    prompt: Add a divide(a, b) function to calc.py that raises ValueError when b is zero, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add divide("}}

  - at: +2d
    drift:
      - clean: .pytest_cache
    prompt: >-
      Build a power(base, exponent) function in calc.py, with a test. And
      please remember the house rules: run pytest as
      `pytest -q -p no:cacheprovider`, and add the `- add <name>()` line to
      CHANGELOG.md.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add power("}}

  - at: +3d
    drift:
      - clean: .pytest_cache
    prompt: Add a mean(values) function to calc.py that averages a list of numbers, with a test.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add mean("}}

  - at: +4d
    drift:
      - clean: .pytest_cache
    prompt: Add a median(values) function to calc.py, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add median("}}

  - at: +5d
    drift:
      - clean: .pytest_cache
    prompt: Add a mode(values) function to calc.py that returns the most common value, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add mode("}}

  - at: +6d
    drift:
      - clean: .pytest_cache
    prompt: Add a clamp(value, low, high) function to calc.py, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add clamp("}}

  - at: +7d
    drift:
      - clean: .pytest_cache
    prompt: Add a percentage(part, whole) function to calc.py that raises ValueError when whole is zero, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add percentage("}}

  - at: +8d
    drift:
      - clean: .pytest_cache
    prompt: Add a absolute_difference(a, b) function to calc.py, with a test.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add absolute_difference("}}

  - at: +9d
    drift:
      - clean: .pytest_cache
    prompt: Add a factorial(n) function to calc.py that raises ValueError for a negative n, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add factorial("}}

  - at: +10d
    drift:
      - clean: .pytest_cache
    prompt: Add a gcd(a, b) function to calc.py, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add gcd("}}

  - at: +11d
    drift:
      - clean: .pytest_cache
    prompt: Add a lcm(a, b) function to calc.py, with tests.
    observe:
      - {label: no .pytest_cache left, file_absent: "{project}/.pytest_cache"}
      - {label: CHANGELOG entry, file_contains: {path: "{project}/CHANGELOG.md", text: "add lcm("}}
